<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted | Joseph Shipley</title>
    <style>
        body {
            margin: 0;
            background-color: #ff0000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 20px;
        }
        img {
            max-width: 520px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 30px auto;
        }
        p {
            font-size: 1.4rem;
            line-height: 1.8;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.ibb.co/XZBZ70rp/2-E0-DDD78-54-F3-4794-95-A0-C0-FBF86-CD97-A.jpg" alt="Anti-AI Warning">
        <span id="countdown-num">10</span> seconds...
        
    </div>

    <script>
        let secondsLeft = 10;
        const countdownInterval = setInterval(() => {
            secondsLeft--;
            const numEl = document.getElementById("countdown-num");
            if (numEl) numEl.textContent = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.href = "https://www.google.com";
            }
        }, 1000);
    </script>

</body>
</html>
